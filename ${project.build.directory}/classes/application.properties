spring.application.name=truvish-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/truvish_db
spring.datasource.username=postgres
spring.datasource.password=suman

# File upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB
spring.servlet.multipart.enabled=true

# Tomcat POST request settings
server.tomcat.max-http-post-size=200MB
server.tomcat.max-swallow-size=200MB
server.tomcat.max-parameter-count=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
