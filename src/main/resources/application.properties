spring.application.name=truvish-backend

# Railway DB config (IMPORTANT)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# File upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB
spring.servlet.multipart.enabled=true

# Tomcat POST request settings
server.tomcat.max-http-post-size=200MB
server.tomcat.max-swallow-size=200MB
server.tomcat.max-parameter-count=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# IMPORTANT for Railway
server.port=${PORT:8080}
