#=====================================================
spring.application.name=truvish-backend

# =========================================================
# SERVER
# =========================================================
server.port=${PORT:8080}

# =========================================================
# DATABASE - POSTGRESQL
# =========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# FILE UPLOAD
# =========================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB

server.tomcat.max-http-post-size=200MB
server.tomcat.max-swallow-size=200MB
server.tomcat.max-parameter-count=20000

# =========================================================
# GMAIL SMTP CONFIGURATION
# =========================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# =========================================================
# GMAIL ACCOUNT
# =========================================================
spring.mail.username=${GMAIL_USERNAME}
spring.mail.password=${GMAIL_APP_PASSWORD}

# =========================================================
# SMTP SETTINGS
# =========================================================
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# =========================================================
# TIMEOUT SETTINGS
# =========================================================
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =========================================================
# DEBUG LOGS
# =========================================================
spring.mail.properties.mail.debug=true

# =========================================================
# MAIL SETTINGS
# =========================================================
app.mail.sender-name=Truvish Solutions
app.mail.sender-email=${GMAIL_USERNAME}

# DEFAULT RECEIVER
app.mail.receiver=${MAIL_RECEIVER}

# =========================================================
# FRONTEND URL (CORS)
# =========================================================
app.frontend.url=${FRONTEND_URL}

# =========================================================
# FILE STORAGE URL
# =========================================================
app.backend.url=${BACKEND_URL}