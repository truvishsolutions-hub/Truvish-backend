# =========================================================
# APPLICATION
# =========================================================
spring.application.name=truvish-backend

# =========================================================
# SERVER
# =========================================================
server.port=${PORT:8080}

# =========================================================
# DATABASE - POSTGRESQL
# =========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# HIKARI CONNECTION POOL
# =========================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# =========================================================
# FILE UPLOAD
# =========================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB

server.tomcat.max-http-post-size=200MB
server.tomcat.max-swallow-size=200MB
server.tomcat.max-parameter-count=20000

# =========================================================
# RESEND CONFIG
# =========================================================
resend.api.key=${RESEND_API_KEY}

# =========================================================
# MAIL SETTINGS
# =========================================================
app.mail.sender-name=Truvish Solutions
app.mail.sender-email=truvishsolutions@gmail.com
app.mail.receiver=${MAIL_RECEIVER}

# =========================================================
# FRONTEND URL (CORS)
# =========================================================
app.frontend.url=${FRONTEND_URL}

# =========================================================
# BACKEND URL
# =========================================================
app.backend.url=${BACKEND_URL}

# =========================================================
# LOGGING
# =========================================================
logging.level.org.springframework=INFO
logging.level.root=INFO

# =========================================================
# ERROR HANDLING
# =========================================================
server.error.include-message=always
server.error.include-binding-errors=always

# =========================================================
# UTF-8 ENCODING
# =========================================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
