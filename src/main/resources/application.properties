spring.application.name=truvish-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/truvish_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:suman}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB
spring.servlet.multipart.enabled=true

server.tomcat.max-http-post-size=200MB
server.tomcat.max-swallow-size=200MB
server.tomcat.max-parameter-count=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:truvishsolutions@gmail.com}
spring.mail.password=${GMAIL_APP_PASSWORD:jbxtjrcicnjhbjyo}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Receiver email
app.mail.receiver=${MAIL_RECEIVER:truvishsolutions@gmail.com}

# Frontend URL for CORS
app.frontend.url=${FRONTEND_URL:http://localhost:5173}